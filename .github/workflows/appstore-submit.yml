name: App Store Submit（上架审核）

# 手动触发：在 GitHub 仓库 Actions 页点 "Run workflow"
# 前置：main 分支已 push 过（ios-build.yml 会自动把 IPA 上传到 TestFlight，形成可提交的 build）
on:
  workflow_dispatch:
    inputs:
      notes:
        description: '备注（可选，仅记录用）'
        required: false
        default: ''
      regenerate_screenshots:
        description: '是否重新生成截图（会调用 DeepSeek 生成真实内容，较慢）'
        type: boolean
        required: false
        default: false

jobs:
  submit:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer || \
          sudo xcode-select -s /Applications/Xcode_26.1.1.app/Contents/Developer || \
          sudo xcode-select -s /Applications/Xcode_26.0.1.app/Contents/Developer
          xcodebuild -version

      - name: Setup Node
        if: ${{ inputs.regenerate_screenshots == true }}
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright + Chromium（仅在需要重新截图时）
        if: ${{ inputs.regenerate_screenshots == true }}
        run: |
          npm ci
          npx playwright install chromium

      - name: Generate App Store screenshots（真实界面）
        if: ${{ inputs.regenerate_screenshots == true }}
        run: node scripts/make_screenshots.mjs

      - name: Upload generated screenshots artifact
        if: ${{ inputs.regenerate_screenshots == true }}
        uses: actions/upload-artifact@v4
        with:
          name: appstore-screenshots
          path: fastlane/metadata/zh-Hans/screenshots/

      - name: Install fastlane
        run: sudo gem install fastlane -N

      - name: Decode App Store Connect API Key (.p8) + 生成 fastlane 用的 JSON 密钥
        env:
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY_B64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          echo "APPLE_API_KEY_B64 length: ${#APPLE_API_KEY_B64}"
          echo "$APPLE_API_KEY_B64" | base64 --decode > AuthKey_TVTRXQKFKT.p8
          echo "decoded p8 bytes: $(stat -f%z AuthKey_TVTRXQKFKT.p8 2>/dev/null || stat -c%s AuthKey_TVTRXQKFKT.p8 2>/dev/null)"
          # fastlane 的 api_key_path / APP_STORE_CONNECT_API_KEY_KEY_FILEPATH 必须是 JSON 格式，不是裸 .p8
          python3 - << 'PY'
          import os, json
          key_id = os.environ['APPLE_API_KEY_ID']
          issuer_id = os.environ['APPLE_API_ISSUER_ID']
          with open('AuthKey_TVTRXQKFKT.p8') as f:
              pem = f.read()
          with open('api_key.json', 'w') as f:
              json.dump({"key_id": key_id, "issuer_id": issuer_id, "key": pem}, f)
          print("api_key.json written, pem bytes:", len(pem))
          PY

      - name: Ensure app pricing is set to free (API Key)
        continue-on-error: true
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY_B64 }}
        run: |
          python3 -m pip install --quiet cryptography >/dev/null 2>&1 || pip3 install --quiet cryptography >/dev/null 2>&1 || true
          python3 - << 'PY'
          import os, base64, time, json, sys, urllib.request, urllib.error
          from cryptography.hazmat.primitives.asymmetric.utils import decode_dss_signature
          from cryptography.hazmat.primitives.asymmetric import ec
          from cryptography.hazmat.primitives import hashes, serialization
          key_id = os.environ['APPLE_API_KEY_ID']; issuer = os.environ['APPLE_API_ISSUER_ID']
          key = serialization.load_pem_private_key(base64.b64decode(os.environ['APPLE_API_KEY_B64']), password=None)
          def b64url(b): return base64.urlsafe_b64encode(b).rstrip(b'=').decode()
          def jwt():
              now = int(time.time())
              h = b64url(json.dumps({'alg':'ES256','kid':key_id,'typ':'JWT'}).encode())
              p = b64url(json.dumps({'iss':issuer,'iat':now-20,'exp':now+600,'aud':'appstoreconnect-v1'}).encode())
              sig = key.sign(f'{h}.{p}'.encode(), ec.ECDSA(hashes.SHA256())); r, s = decode_dss_signature(sig)
              return f'{h}.{p}.{b64url(r.to_bytes(32,"big")+s.to_bytes(32,"big"))}'
          def api(method, url, body=None):
              data = json.dumps(body).encode() if body is not None else None
              req = urllib.request.Request(url, data=data, method=method, headers={'Authorization': f'Bearer {jwt()}', 'Accept':'application/json', 'Content-Type':'application/json'})
              try:
                  with urllib.request.urlopen(req, timeout=60) as r: return r.status, json.load(r)
              except urllib.error.HTTPError as e:
                  print(f'HTTP {e.code} on {method} {url}'); print(e.read().decode()[:2000]); return e.code, None
          apps = api('GET', 'https://api.appstoreconnect.apple.com/v1/apps?filter[bundleId]=com.coldtank.cards')[1]
          if not apps or not apps.get('data'): print('ERROR: app not found'); sys.exit(1)
          app_id = apps['data'][0]['id']; print(f'app_id={app_id}')
          st, sched = api('GET', f'https://api.appstoreconnect.apple.com/v1/apps/{app_id}/appPriceSchedule')
          if st == 200 and sched and sched.get('data'): print('Price schedule already exists, skip'); sys.exit(0)
          st, pp = api('GET', f'https://api.appstoreconnect.apple.com/v1/apps/{app_id}/appPricePoints?filter[territory]=USA&limit=200')
          free_id = None
          for p in (pp or {}).get('data', []):
              if p.get('attributes', {}).get('customerPrice') == '0.0': free_id = p['id']; break
          if not free_id: print('ERROR: cannot find free USA price point'); sys.exit(1)
          body = {'data': {'type':'appPriceSchedules','attributes':{},'relationships':{'app':{'data':{'type':'apps','id':app_id}},'baseTerritory':{'data':{'type':'territories','id':'USA'}},'manualPrices':{'data':[{'type':'appPrices','id':'free-usa-1'}]}}},'included':[{'type':'appPrices','id':'free-usa-1','attributes':{'startDate':None,'endDate':None},'relationships':{'appPricePoint':{'data':{'type':'appPricePoints','id':free_id}}}}]}
          st2, resp2 = api('POST', 'https://api.appstoreconnect.apple.com/v1/appPriceSchedules', body)
          if st2 == 201: print('SUCCESS: set app price to free')
          else: print(f'WARN: failed to set price (HTTP {st2}), fastlane will surface if required')
          PY

      - name: Ensure appStoreReviewDetail exists（绕过 fastlane 首版 review_attachment_file 的 No data 崩溃）
        continue-on-error: true
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY_B64 }}
        run: |
          python3 -m pip install --quiet cryptography >/dev/null 2>&1 || pip3 install --quiet cryptography >/dev/null 2>&1 || true
          python3 - << 'PY'
          import os, base64, time, json, sys, urllib.request, urllib.error
          from cryptography.hazmat.primitives.asymmetric import ec
          from cryptography.hazmat.primitives import hashes, serialization
          from cryptography.hazmat.primitives.asymmetric.utils import decode_dss_signature
          key_id = os.environ['APPLE_API_KEY_ID']; issuer = os.environ['APPLE_API_ISSUER_ID']
          key = serialization.load_pem_private_key(base64.b64decode(os.environ['APPLE_API_KEY_B64']), password=None)
          def b64url(b): return base64.urlsafe_b64encode(b).rstrip(b'=').decode()
          def jwt():
              now = int(time.time())
              h = b64url(json.dumps({'alg':'ES256','kid':key_id,'typ':'JWT'}).encode())
              p = b64url(json.dumps({'iss':issuer,'iat':now-20,'exp':now+600,'aud':'appstoreconnect-v1'}).encode())
              sig = key.sign(f'{h}.{p}'.encode(), ec.ECDSA(hashes.SHA256())); r, s = decode_dss_signature(sig)
              return f'{h}.{p}.{b64url(r.to_bytes(32,"big")+s.to_bytes(32,"big"))}'
          def api(method, url, body=None):
              data = json.dumps(body).encode() if body is not None else None
              req = urllib.request.Request(url, data=data, method=method, headers={'Authorization': f'Bearer {jwt()}', 'Accept':'application/json', 'Content-Type':'application/json'})
              try:
                  with urllib.request.urlopen(req, timeout=60) as r: return r.status, json.load(r)
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode()[:800]
          st, apps = api('GET', 'https://api.appstoreconnect.apple.com/v1/apps?filter[bundleId]=com.coldtank.cards')
          if st != 200 or not apps.get('data'):
              print(f'WARN: app not found (HTTP {st}), skip pre-create'); sys.exit(0)
          app_id = apps['data'][0]['id']
          st, vers = api('GET', f'https://api.appstoreconnect.apple.com/v1/apps/{app_id}/appStoreVersions?filter[version]=1.0')
          if st != 200 or not vers.get('data'):
              print(f'WARN: version 1.0 not found (HTTP {st}), skip pre-create'); sys.exit(0)
          ver_id = vers['data'][0]['id']
          body = {'data': {'type':'appStoreReviewDetails','attributes':{},'relationships': {'appStoreVersion': {'data': {'type':'appStoreVersions','id':ver_id}}}}}
          st, resp = api('POST', 'https://api.appstoreconnect.apple.com/v1/appStoreReviewDetails', body)
          if st == 201:
              print('SUCCESS: appStoreReviewDetail 已预创建')
          elif st == 409 or (isinstance(resp, str) and 'exists' in resp.lower()):
              print('NOTE: review detail 已存在，无需创建')
          else:
              print(f'NOTE: 预创建返回 HTTP {st}（不影响后续）: {resp}')
          PY

      - name: fastlane deliver + submit_for_review
        env:
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_KEY_FILEPATH: ${{ github.workspace }}/api_key.json
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          echo "=== 开始提交到 App Store 审核 ==="
          fastlane submit
          echo "=== 提交完成（若上方无 ERROR 即已进入审核队列） ==="
